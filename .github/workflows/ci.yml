name: Isolated checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build backend and isolated test image
        run: |
          docker build -f backend/Dockerfile -t studio-public-ci-backend:local .
          docker build -f deploy/ci/Dockerfile.test -t studio-public-ci-test:local .
      - name: Build pinned MinIO image
        run: docker build -f deploy/minio/Dockerfile -t studio-public-ci-minio:local .
      - name: Migrate and run the full backend suite
        env:
          PUBLIC_CI_PROJECT: studio-public-ci-${{ github.run_id }}
        run: bash deploy/ci/run.sh
      - name: Save backend test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-junit
          path: deploy/ci/results/backend.xml
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.5
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build
