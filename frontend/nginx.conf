log_format studio_safe '$remote_addr [$time_local] "$uri" $status $body_bytes_sent';
access_log /var/log/nginx/access.log studio_safe;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz { return 200 "ok\n"; }

    # OAuth code/state must never enter either nginx access or upstream error logs.
    location = /api/publish-accounts/douyin/callback {
        access_log off;
        error_log /dev/null crit;
        if (-f /etc/studio-runtime/maintenance.block) { return 503; }
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 70s;
    }

    location /api/ {
        if (-f /etc/studio-runtime/maintenance.block) { return 503; }
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 70s;
    }

    location /objects/ {
        if (-f /etc/studio-runtime/maintenance.block) { return 503; }
        rewrite ^/objects/(.*)$ /$1 break;
        proxy_pass http://minio:9000;
        proxy_set_header Host minio:9000;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_request_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
